<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#13152a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Swipe To-Do — управляй задачами свайпами">
  <title>Swipe To-Do</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ===========================================
       1. DESIGN TOKENS
       =========================================== */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-primary: hsl(230, 25%, 8%);
      --bg-secondary: hsl(230, 20%, 14%);
      --bg-card: hsla(230, 25%, 20%, 0.6);
      --bg-card-hover: hsla(230, 25%, 25%, 0.7);
      --bg-nav: hsla(230, 25%, 12%, 0.9);
      --bg-input: hsla(230, 25%, 16%, 0.7);

      --text-primary: hsl(0, 0%, 95%);
      --text-secondary: hsl(230, 10%, 60%);
      --text-muted: hsl(230, 10%, 40%);

      --accent-green: hsl(145, 65%, 48%);
      --accent-red: hsl(0, 72%, 55%);
      --accent-blue: hsl(215, 80%, 58%);
      --accent-purple: hsl(265, 70%, 60%);

      --border-subtle: hsla(0, 0%, 100%, 0.08);
      --border-card: hsla(0, 0%, 100%, 0.12);

      --shadow-card: 0 8px 32px hsla(0, 0%, 0%, 0.3);
      --shadow-elevated: 0 16px 48px hsla(0, 0%, 0%, 0.4);
      --shadow-btn: 0 4px 16px hsla(0, 0%, 0%, 0.2);

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-md: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.35rem;
      --font-size-2xl: 1.75rem;

      --transition-fast: 150ms ease;
      --transition-normal: 300ms ease;
      --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);

      --z-card: 10;
      --z-card-front: 20;
      --z-nav: 100;
      --z-overlay: 200;

      --glass-blur: blur(20px) saturate(180%);
      --glass-border: 1px solid var(--border-card);
    }

    /* ===========================================
       2. BASE
       =========================================== */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      height: 100vh;
      height: 100dvh; /* dynamic viewport height для мобильных */
      width: 100vw;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 68px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
    }

    .view.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Навигация */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: calc(68px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 6px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg-nav);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--border-subtle);
      z-index: var(--z-nav);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: color var(--transition-fast);
      position: relative;
    }

    .nav-btn.active { color: var(--accent-purple); }
    .nav-btn svg { width: 24px; height: 24px; }

    .badge {
      position: absolute;
      top: 0;
      right: 50%;
      transform: translateX(20px);
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: var(--radius-full);
      background: var(--accent-red);
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .badge:empty { display: none; }

    /* Скроллбар */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: var(--radius-full); }

    /* ===========================================
       3. ANIMATIONS
       =========================================== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes flyOutRight {
      to { opacity: 0; transform: translateX(150%) rotate(25deg); }
    }

    @keyframes flyOutLeft {
      to { opacity: 0; transform: translateX(-150%) rotate(-25deg); }
    }

    @keyframes flyOutUp {
      to { opacity: 0; transform: translateY(-150%) scale(0.8); }
    }

    @keyframes celebrateEmoji {
      0% { transform: scale(0) rotate(-20deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 hsla(265, 70%, 60%, 0.4); }
      50% { box-shadow: 0 0 0 8px hsla(265, 70%, 60%, 0); }
    }

    .animate-card-enter { animation: cardEnter var(--transition-spring); }
    .card-exit-right { animation: flyOutRight 400ms ease forwards; }
    .card-exit-left { animation: flyOutLeft 400ms ease forwards; }
    .card-exit-up { animation: flyOutUp 400ms ease forwards; }

    .task-item-enter { animation: fadeIn 300ms ease both; }
    .task-item-enter:nth-child(1) { animation-delay: 0ms; }
    .task-item-enter:nth-child(2) { animation-delay: 40ms; }
    .task-item-enter:nth-child(3) { animation-delay: 80ms; }
    .task-item-enter:nth-child(4) { animation-delay: 120ms; }
    .task-item-enter:nth-child(5) { animation-delay: 160ms; }
    .task-item-enter:nth-child(6) { animation-delay: 200ms; }
    .task-item-enter:nth-child(7) { animation-delay: 240ms; }
    .task-item-enter:nth-child(8) { animation-delay: 280ms; }

    /* ===========================================
       4. INPUT SCREEN
       =========================================== */
    .input-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: var(--space-xl) var(--space-lg);
      gap: var(--space-lg);
      max-width: 480px;
      margin: 0 auto;
    }

    .input-container h1 {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      text-align: center;
      margin: 0;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-subtitle {
      color: var(--text-secondary);
      font-size: var(--font-size-md);
      text-align: center;
      margin: 0;
      margin-top: -8px;
    }

    #task-input {
      width: 100%;
      min-height: 110px;
      padding: var(--space-lg);
      border-radius: var(--radius-lg);
      background: var(--bg-input);
      border: var(--glass-border);
      color: var(--text-primary);
      font-size: var(--font-size-lg);
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: var(--shadow-card);
      -webkit-appearance: none;
    }

    #task-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px hsla(265, 70%, 60%, 0.15);
    }

    #task-input::placeholder { color: var(--text-muted); }

    #add-task-btn {
      width: 100%;
      padding: 16px 32px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-purple), hsl(285, 70%, 55%));
      color: white;
      font-size: var(--font-size-lg);
      font-weight: 600;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-btn);
      letter-spacing: 0.5px;
    }

    #add-task-btn:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    .input-feedback {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: var(--radius-full);
      background: var(--accent-green);
      color: white;
      font-weight: 600;
      font-size: var(--font-size-sm);
      animation: slideUp 300ms ease;
      z-index: var(--z-overlay);
      pointer-events: none;
      white-space: nowrap;
    }

    /* ===========================================
       5. TRIAGE SCREEN
       =========================================== */
    .triage-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: var(--space-lg);
      position: relative;
      overflow: hidden;
    }

    .triage-header { text-align: center; margin-bottom: var(--space-md); }
    .triage-header h2 { font-size: var(--font-size-xl); font-weight: 600; margin: 0; }
    .triage-counter { font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: var(--space-xs); }

    .swipe-hints {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 0 var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .hint {
      font-size: var(--font-size-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .hint-left { color: hsla(0, 72%, 55%, 0.5); }
    .hint-right { color: hsla(145, 65%, 48%, 0.5); }
    .hint-up { color: hsla(215, 80%, 58%, 0.5); }

    .card-stack {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 220px;
    }

    .swipe-bg {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      opacity: 0;
      transition: opacity 200ms ease, background 200ms ease;
    }

    .swipe-bg.show-right { opacity: 1; background: hsla(145, 65%, 48%, 0.15); }
    .swipe-bg.show-left { opacity: 1; background: hsla(0, 72%, 55%, 0.15); }
    .swipe-bg.show-up { opacity: 1; background: hsla(215, 80%, 58%, 0.15); }

    .task-card {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--transition-fast);
      z-index: var(--z-card-front);
      will-change: transform;
    }

    .task-card:active { cursor: grabbing; }
    .task-card.dragging { box-shadow: var(--shadow-elevated); }

    .card-text {
      font-size: var(--font-size-xl);
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
      margin: 0 0 var(--space-md) 0;
    }

    .card-date { font-size: var(--font-size-xs); color: var(--text-muted); }

    .card-next {
      z-index: var(--z-card);
      transform: scale(0.95) translateY(8px);
      opacity: 0.4;
      pointer-events: none;
    }

    /* Пустое состояние */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: var(--space-lg);
      text-align: center;
      padding: var(--space-xl);
    }

    .empty-state .emoji {
      font-size: 72px;
      animation: celebrateEmoji 600ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .empty-state h2 { font-size: var(--font-size-xl); font-weight: 600; margin: 0; }
    .empty-state p { color: var(--text-secondary); font-size: var(--font-size-md); margin: 0; }

    /* ===========================================
       6. LISTS SCREEN
       =========================================== */
    .lists-container {
      padding: var(--space-lg);
      padding-bottom: 80px;
      max-width: 560px;
      margin: 0 auto;
      overflow-y: auto;
      height: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .task-section { margin-bottom: var(--space-xl); }

    .task-section h2 {
      font-size: var(--font-size-lg);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin: 0 0 var(--space-md) 0;
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-count {
      font-size: var(--font-size-sm);
      background: var(--bg-card);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      font-weight: 500;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }

    .task-item.completed { opacity: 0.4; }
    .task-item.completed .task-item-text { text-decoration: line-through; color: var(--text-muted); }

    .task-item-checkbox {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 2px solid var(--border-card);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      flex-shrink: 0;
      color: transparent;
      font-size: 14px;
    }

    .task-item-checkbox.checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: white;
    }

    .task-item-text {
      flex: 1;
      font-size: var(--font-size-md);
      line-height: 1.4;
    }

    .task-item-actions { display: flex; gap: var(--space-xs); flex-shrink: 0; }

    .task-action-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all var(--transition-fast);
      font-size: 18px;
    }

    .task-action-btn:active { background: hsla(0, 0%, 100%, 0.08); color: var(--accent-blue); }

    .empty-section {
      text-align: center;
      padding: var(--space-xl);
      color: var(--text-muted);
      font-size: var(--font-size-sm);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ===== INPUT VIEW ===== -->
    <section id="view-input" class="view active">
      <div class="input-container">
        <h1>Что нужно сделать?</h1>
        <p class="input-subtitle">Просто запишите — отсортируете потом</p>
        <textarea id="task-input" placeholder="Купить молоко, позвонить маме..." rows="4"></textarea>
        <button id="add-task-btn">Добавить</button>
      </div>
    </section>

    <!-- ===== TRIAGE VIEW ===== -->
    <section id="view-triage" class="view">
      <div class="triage-container" id="triage-container">
        <div class="triage-header">
          <h2>Сортировка</h2>
          <p class="triage-counter">Осталось: <span id="triage-remaining">0</span></p>
        </div>
        <div class="swipe-hints">
          <span class="hint hint-left">✕ Отложить</span>
          <span class="hint hint-up">↑ На неделю</span>
          <span class="hint hint-right">Сегодня ✓</span>
        </div>
        <div class="card-stack" id="card-stack">
          <div class="swipe-bg" id="swipe-bg">
            <span class="swipe-bg-icon"></span>
          </div>
          <div class="task-card card-next" id="next-card" style="display:none">
            <p class="card-text"></p>
          </div>
          <div class="task-card" id="current-card" style="display:none">
            <p class="card-text"></p>
            <span class="card-date"></span>
          </div>
        </div>
      </div>
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="emoji">🎉</div>
        <h2>Все дела отсортированы!</h2>
        <p>Добавьте новые задачи на экране ввода</p>
      </div>
    </section>

    <!-- ===== LISTS VIEW ===== -->
    <section id="view-lists" class="view">
      <div class="lists-container">
        <section class="task-section">
          <h2>☀️ На сегодня <span class="section-count" id="today-count">0</span></h2>
          <ul id="today-list" class="task-list"></ul>
          <p class="empty-section" id="today-empty">Нет задач на сегодня</p>
        </section>
        <section class="task-section">
          <h2>📅 На неделю <span class="section-count" id="week-count">0</span></h2>
          <ul id="week-list" class="task-list"></ul>
          <p class="empty-section" id="week-empty">Нет задач на неделю</p>
        </section>
      </div>
    </section>

    <!-- ===== BOTTOM NAV ===== -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="input">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Ввод</span>
      </button>
      <button class="nav-btn" data-view="triage">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <span>Сортировка</span>
        <span class="badge" id="inbox-count"></span>
      </button>
      <button class="nav-btn" data-view="lists">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Списки</span>
      </button>
    </nav>
  </div>

  <script>
    'use strict';

    // ===========================================
    // 0. TELEGRAM WEBAPP — ИНИЦИАЛИЗАЦИЯ
    // ===========================================
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Тёмная тема для шапки Telegram
      try {
        tg.setHeaderColor('#13152a');
        tg.setBackgroundColor('#13152a');
      } catch (e) {}

      // КРИТИЧНО: отключаем вертикальный свайп для закрытия,
      // иначе свайп вверх (→ "на неделю") будет закрывать Mini App
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
        tg.disableVerticalSwipes();
      }

      // Подтверждение при попытке закрытия
      tg.enableClosingConfirmation();
    }

    /** Тактильная отдача (вибрация) для iPhone */
    function haptic(type) {
      if (!tg || !tg.HapticFeedback) return;
      try {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
        else if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        else if (type === 'select') tg.HapticFeedback.selectionChanged();
      } catch (e) {}
    }

    // ===========================================
    // 1. TASK STORE — CRUD + LocalStorage + Observer
    // ===========================================
    function getStartOfToday() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d.toISOString();
    }

    function getStartOfNextWeek() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1) + 7;
      d.setDate(diff);
      return d.toISOString();
    }

    class TaskStore {
      constructor() {
        this.STORAGE_KEY = 'swipe-todo-tasks';
        this.subscribers = [];
        const stored = localStorage.getItem(this.STORAGE_KEY);
        try {
          this.tasks = stored ? JSON.parse(stored) : [];
        } catch (e) {
          this.tasks = [];
        }
      }

      addTask(text) {
        const task = {
          id: crypto.randomUUID(),
          text: text,
          status: 'inbox',
          createdAt: new Date().toISOString(),
          scheduledDate: null
        };
        this.tasks.push(task);
        this._save();
        this._notify();
        return task;
      }

      updateStatus(id, newStatus) {
        const task = this.tasks.find(t => t.id === id);
        if (!task) return null;
        task.status = newStatus;
        if (newStatus === 'today') task.scheduledDate = getStartOfToday();
        else if (newStatus === 'week') task.scheduledDate = getStartOfNextWeek();
        else task.scheduledDate = null;
        this._save();
        this._notify();
        return task;
      }

      deleteTask(id) {
        this.tasks = this.tasks.filter(t => t.id !== id);
        this._save();
        this._notify();
      }

      moveToInbox(id) { return this.updateStatus(id, 'inbox'); }

      getInbox() {
        return this.tasks.filter(t => t.status === 'inbox')
          .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      }

      getToday() {
        return this.tasks.filter(t => t.status === 'today')
          .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      }

      getWeek() {
        return this.tasks.filter(t => t.status === 'week')
          .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      }

      subscribe(callback) {
        this.subscribers.push(callback);
        return () => { this.subscribers = this.subscribers.filter(cb => cb !== callback); };
      }

      _save() { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.tasks)); }
      _notify() { this.subscribers.forEach(cb => cb()); }
    }

    // ===========================================
    // 2. SWIPE HANDLER — Pointer Events
    // ===========================================
    class SwipeHandler {
      constructor(containerEl, options = {}) {
        this.containerEl = containerEl;
        this.options = {
          onSwipeRight: options.onSwipeRight || (() => {}),
          onSwipeLeft: options.onSwipeLeft || (() => {}),
          onSwipeUp: options.onSwipeUp || (() => {}),
          onDragMove: options.onDragMove || (() => {}),
          onDragEnd: options.onDragEnd || (() => {}),
          threshold: options.threshold || 80 // чуть меньше для мобильных
        };
        this.currentCard = null;
        this.dragging = false;
        this.startX = 0;
        this.startY = 0;
        this._onPointerDown = this._onPointerDown.bind(this);
        this._onPointerMove = this._onPointerMove.bind(this);
        this._onPointerUp = this._onPointerUp.bind(this);
      }

      bindCard(cardEl) {
        if (this.currentCard) this.unbindCard();
        this.currentCard = cardEl;
        this.currentCard.style.touchAction = 'none';
        this.currentCard.addEventListener('pointerdown', this._onPointerDown);
        this.currentCard.addEventListener('pointermove', this._onPointerMove);
        this.currentCard.addEventListener('pointerup', this._onPointerUp);
        this.currentCard.addEventListener('pointercancel', this._onPointerUp);
      }

      unbindCard() {
        if (!this.currentCard) return;
        this.currentCard.removeEventListener('pointerdown', this._onPointerDown);
        this.currentCard.removeEventListener('pointermove', this._onPointerMove);
        this.currentCard.removeEventListener('pointerup', this._onPointerUp);
        this.currentCard.removeEventListener('pointercancel', this._onPointerUp);
        this.currentCard.style.touchAction = '';
        this.currentCard = null;
      }

      _onPointerDown(e) {
        this.dragging = true;
        this.startX = e.clientX;
        this.startY = e.clientY;
        this.currentCard.setPointerCapture(e.pointerId);
        this.currentCard.classList.add('dragging');
        this.currentCard.style.transition = 'none';
        haptic('light');
      }

      _onPointerMove(e) {
        if (!this.dragging) return;
        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        const rotation = dx * 0.08;
        this.currentCard.style.transform = `translate(${dx}px, ${dy}px) rotate(${rotation}deg)`;
        this.options.onDragMove(dx, dy, this.currentCard);
      }

      _onPointerUp(e) {
        if (!this.dragging) return;
        this.dragging = false;
        const card = this.currentCard;
        if (!card) return;
        try { card.releasePointerCapture(e.pointerId); } catch (_) {}
        card.classList.remove('dragging');

        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (absDy > absDx && -dy > this.options.threshold) {
          haptic('medium');
          this._animateExit('card-exit-up', () => this.options.onSwipeUp(card));
        } else if (absDx > this.options.threshold && dx > 0) {
          haptic('success');
          this._animateExit('card-exit-right', () => this.options.onSwipeRight(card));
        } else if (absDx > this.options.threshold && dx < 0) {
          haptic('warning');
          this._animateExit('card-exit-left', () => this.options.onSwipeLeft(card));
        } else {
          card.style.transition = 'transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1)';
          card.style.transform = 'translate(0,0) rotate(0deg)';
          this.options.onDragEnd(card);
        }
      }

      _animateExit(animationClass, callback) {
        const card = this.currentCard;
        card.classList.add(animationClass);
        const onEnd = () => { card.removeEventListener('animationend', onEnd); callback(); };
        card.addEventListener('animationend', onEnd);
        this.unbindCard();
      }

      destroy() { this.unbindCard(); }
    }

    // ===========================================
    // 3. INPUT VIEW
    // ===========================================
    function initInputView(store) {
      const taskInput = document.getElementById('task-input');
      const addBtn = document.getElementById('add-task-btn');
      if (!taskInput || !addBtn) return;

      function handleAdd() {
        const text = taskInput.value.trim();
        if (!text) return;
        store.addTask(text);
        taskInput.value = '';
        taskInput.focus();
        haptic('success');
        showFeedback();
      }

      addBtn.addEventListener('click', handleAdd);
      taskInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleAdd();
        }
      });

      function showFeedback() {
        const fb = document.createElement('div');
        fb.className = 'input-feedback';
        fb.textContent = '✓ Задача добавлена';
        document.body.appendChild(fb);
        setTimeout(() => {
          fb.style.opacity = '0';
          fb.style.transition = 'opacity 0.3s ease';
          setTimeout(() => { if (fb.parentNode) fb.parentNode.removeChild(fb); }, 300);
        }, 1500);
      }
    }

    // ===========================================
    // 4. TRIAGE VIEW
    // ===========================================
    function initTriageView(store) {
      const cardStack = document.getElementById('card-stack');
      const currentCard = document.getElementById('current-card');
      const nextCard = document.getElementById('next-card');
      const swipeBg = document.getElementById('swipe-bg');
      const emptyState = document.getElementById('empty-state');
      const triageContainer = document.getElementById('triage-container');
      const triageRemaining = document.getElementById('triage-remaining');
      if (!cardStack) return;

      const swipeHandler = new SwipeHandler(cardStack, {
        onDragMove: function(dx, dy) {
          swipeBg.classList.remove('show-right', 'show-left', 'show-up');
          const icon = swipeBg.querySelector('.swipe-bg-icon');
          const absDx = Math.abs(dx);
          const absDy = Math.abs(dy);

          if (absDx > 25 || -dy > 25) {
            if (absDx > absDy) {
              if (dx > 0) { swipeBg.classList.add('show-right'); icon.textContent = '✓'; }
              else { swipeBg.classList.add('show-left'); icon.textContent = '✕'; }
            } else if (dy < 0) {
              swipeBg.classList.add('show-up'); icon.textContent = '↑';
            }
          }
        },
        onDragEnd: function() {
          swipeBg.classList.remove('show-right', 'show-left', 'show-up');
        },
        onSwipeRight: function(cardEl) {
          store.updateStatus(cardEl.dataset.taskId, 'today');
          swipeBg.classList.remove('show-right', 'show-left', 'show-up');
          setTimeout(renderCurrentCard, 350);
        },
        onSwipeLeft: function(cardEl) {
          store.updateStatus(cardEl.dataset.taskId, 'dropped');
          swipeBg.classList.remove('show-right', 'show-left', 'show-up');
          setTimeout(renderCurrentCard, 350);
        },
        onSwipeUp: function(cardEl) {
          store.updateStatus(cardEl.dataset.taskId, 'week');
          swipeBg.classList.remove('show-right', 'show-left', 'show-up');
          setTimeout(renderCurrentCard, 350);
        },
        threshold: 80
      });

      function renderCurrentCard() {
        const inbox = store.getInbox();
        triageRemaining.textContent = inbox.length;

        if (inbox.length === 0) {
          triageContainer.style.display = 'none';
          emptyState.style.display = 'flex';
          emptyState.querySelector('.emoji').style.animation = 'none';
          void emptyState.querySelector('.emoji').offsetWidth;
          emptyState.querySelector('.emoji').style.animation = '';
          swipeHandler.unbindCard();
          return;
        }

        triageContainer.style.display = 'flex';
        emptyState.style.display = 'none';

        const task = inbox[0];
        currentCard.querySelector('.card-text').textContent = task.text;
        currentCard.querySelector('.card-date').textContent =
          new Date(task.createdAt).toLocaleDateString('ru-RU');
        currentCard.dataset.taskId = task.id;

        // Полный сброс стилей от предыдущего свайпа
        currentCard.classList.remove(
          'card-exit-right', 'card-exit-left', 'card-exit-up',
          'dragging', 'animate-card-enter'
        );
        currentCard.style.transform = '';
        currentCard.style.transition = '';
        currentCard.style.display = 'flex';
        void currentCard.offsetWidth;
        currentCard.classList.add('animate-card-enter');

        if (inbox.length >= 2) {
          nextCard.style.display = 'flex';
          nextCard.querySelector('.card-text').textContent = inbox[1].text;
        } else {
          nextCard.style.display = 'none';
        }

        swipeHandler.bindCard(currentCard);
      }

      store.subscribe(() => {
        triageRemaining.textContent = store.getInbox().length;
      });

      renderCurrentCard();
      window._triageRender = renderCurrentCard;
    }

    // ===========================================
    // 5. LISTS VIEW
    // ===========================================
    function initListsView(store) {
      const todayList = document.getElementById('today-list');
      const weekList = document.getElementById('week-list');
      const todayCount = document.getElementById('today-count');
      const weekCount = document.getElementById('week-count');
      const todayEmpty = document.getElementById('today-empty');
      const weekEmpty = document.getElementById('week-empty');
      if (!todayList || !weekList) return;

      function render() {
        const todayTasks = store.getToday();
        const weekTasks = store.getWeek();

        todayCount.textContent = todayTasks.length;
        weekCount.textContent = weekTasks.length;
        todayEmpty.style.display = todayTasks.length === 0 ? 'block' : 'none';
        weekEmpty.style.display = weekTasks.length === 0 ? 'block' : 'none';

        todayList.innerHTML = '';
        weekList.innerHTML = '';
        todayTasks.forEach(t => todayList.appendChild(createTaskEl(t)));
        weekTasks.forEach(t => weekList.appendChild(createTaskEl(t)));
      }

      function createTaskEl(task) {
        const li = document.createElement('li');
        li.className = 'task-item task-item-enter';
        li.innerHTML = `
          <button class="task-item-checkbox" title="Выполнено">✓</button>
          <span class="task-item-text"></span>
          <div class="task-item-actions">
            <button class="task-action-btn return-btn" title="Вернуть в inbox">↩</button>
          </div>
        `;
        li.querySelector('.task-item-text').textContent = task.text;

        li.querySelector('.task-item-checkbox').addEventListener('click', function() {
          this.classList.add('checked');
          li.classList.add('completed');
          haptic('success');
          setTimeout(() => store.updateStatus(task.id, 'done'), 500);
        });

        li.querySelector('.return-btn').addEventListener('click', () => {
          haptic('select');
          store.moveToInbox(task.id);
        });

        return li;
      }

      store.subscribe(render);
      render();
    }

    // ===========================================
    // 6. APP — ИНИЦИАЛИЗАЦИЯ И НАВИГАЦИЯ
    // ===========================================
    document.addEventListener('DOMContentLoaded', () => {
      const store = new TaskStore();

      initInputView(store);
      initTriageView(store);
      initListsView(store);

      // Навигация
      const navButtons = document.querySelectorAll('.nav-btn');
      const views = document.querySelectorAll('.view');
      const inboxBadge = document.getElementById('inbox-count');

      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const viewId = btn.getAttribute('data-view');
          haptic('select');

          navButtons.forEach(b => b.classList.remove('active'));
          views.forEach(v => v.classList.remove('active'));

          btn.classList.add('active');
          const target = document.getElementById('view-' + viewId);
          if (target) target.classList.add('active');

          // Обновить карточки при переходе на сортировку
          if (viewId === 'triage' && typeof window._triageRender === 'function') {
            window._triageRender();
          }
        });
      });

      // Бейдж inbox
      function updateBadge() {
        const count = store.getInbox().length;
        inboxBadge.textContent = count > 0 ? count : '';
      }

      store.subscribe(updateBadge);
      updateBadge();
    });
  </script>
</body>
